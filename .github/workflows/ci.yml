name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-logic:
    name: 核心逻辑单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 运行逻辑单元测试
        run: node tools/test_logic.js
