<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>2048</title>
<style>
/* ============ 主题变量 ============ */
:root {
  --bg: #faf8ef;
  --bg-grad: linear-gradient(160deg, #fdfbf3 0%, #f2e8d7 100%);
  --panel: #bbada0;
  --cell: rgba(238, 228, 218, .35);
  --text: #776e65;
  --text-sub: #a29a8f;
  --btn-bg: #8f7a66;
  --btn-bg-hover: #7f6b58;
  --btn-text: #f9f6f2;
  --accent: #edc22e;
  --modal-mask: rgba(238, 228, 218, .72);
  --modal-card: #faf8ef;
  --shadow: 0 8px 24px rgba(0, 0, 0, .10);
  --gap: 12px;
  --tile-font: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--tile-font);
  background: var(--bg-grad);
  color: var(--text);
  overflow-x: hidden;
  transition: background .35s ease, color .35s ease;
}
button { font-family: inherit; cursor: pointer; border: none; outline: none; user-select: none; }

.page {
  max-width: 500px;
  margin: 0 auto;
  padding: 16px 16px 22px;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* ============ 顶部 ============ */
header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.logo {
  margin: 0;
  font-size: 46px;
  line-height: 1;
  font-weight: 800;
  letter-spacing: 2px;
  color: var(--text);
  text-shadow: 0 2px 0 rgba(0,0,0,.06);
}
.tagline { margin: 4px 0 0; font-size: 12px; color: var(--text-sub); }
.scores { display: flex; gap: 8px; }
.score-box {
  min-width: 86px;
  background: var(--panel);
  border-radius: 8px;
  padding: 6px 10px;
  text-align: center;
  box-shadow: var(--shadow);
}
.score-label { display: block; font-size: 10px; letter-spacing: 2px; color: rgba(255,255,255,.75); text-transform: uppercase; }
.score-value { display: block; font-size: 20px; font-weight: 700; color: #fff; line-height: 1.15; }
.score-gamemax { display: block; font-size: 10px; color: rgba(255,255,255,.85); margin-top: 2px; line-height: 1.2; white-space: nowrap; }
.score-box.glow { animation: glowPulse 0.9s ease; }
@keyframes glowPulse {
  0% { box-shadow: 0 0 0 0 rgba(237,194,46,.9); }
  70% { box-shadow: 0 0 0 14px rgba(237,194,46,0); }
  100% { box-shadow: 0 0 0 0 rgba(237,194,46,0); }
}

/* ============ 工具栏 ============ */
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; align-items: center; }
.btn {
  background: var(--btn-bg);
  color: var(--btn-text);
  border-radius: 6px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 600;
  transition: background .15s ease, transform .1s ease, opacity .15s ease;
}
.btn:hover { background: var(--btn-bg-hover); }
.btn:active { transform: scale(.95); }
.btn:disabled { opacity: .45; cursor: default; }
.btn:disabled:hover { background: var(--btn-bg); }
.btn-icon { padding: 6px 9px; font-size: 14px; }
.btn-primary { background: var(--accent); color: #5a4a1a; }
.btn-primary:hover { background: #f6d255; filter: brightness(1.03); }
.btn.ai-running { background: #e74c3c; color: #fff; }
.btn.ai-running:hover { background: #d63a2a; filter: none; }
.toolbar .spacer { flex: 1; }
select.sel-size {
  background: var(--btn-bg);
  color: var(--btn-text);
  border: none;
  border-radius: 6px;
  padding: 6px 6px;
  font-size: 13px;
  font-weight: 600;
  outline: none;
  cursor: pointer;
}
select.sel-size option { background: var(--modal-card); color: var(--text); }

/* ============ 棋盘 ============ */
.board-wrap { display: flex; justify-content: center; }
#board {
  position: relative;
  width: min(92vw, 460px, calc(100vh - 410px));
  aspect-ratio: 1;
  background: var(--panel);
  border-radius: 10px;
  padding: var(--gap);
  box-shadow: var(--shadow);
  touch-action: none;
}
.bg-grid { display: grid; width: 100%; height: 100%; grid-template-columns: repeat(var(--n), 1fr); grid-template-rows: repeat(var(--n), 1fr); gap: var(--gap); }
.bg-cell { background: var(--cell); border-radius: 6px; }

/* 方块：外层只管定位（transform: translate），内层负责颜色与缩放动画，
   两者互不干扰，保证新块在格子正中放大出现 */
.tile {
  position: absolute;
  top: 0; left: 0;
  will-change: transform;
  transition: transform 110ms ease-in-out;
}
.tile-inner {
  width: 100%; height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 6px;
  font-weight: 800;
  transform-origin: center;
  box-shadow: 0 2px 6px rgba(0,0,0,.08);
}
.tile-inner span { line-height: 1; }
.tile-new .tile-inner { animation: tileNew 160ms ease-out; }
@keyframes tileNew { 0% { transform: scale(0); } 100% { transform: scale(1); } }
.tile-merged .tile-inner { animation: tilePop 200ms ease-out; }
@keyframes tilePop {
  0% { transform: scale(0); }
  55% { transform: scale(1.22); }
  100% { transform: scale(1); }
}

/* 经典配色 */
.tile-2 .tile-inner    { background: #eee4da; color: #776e65; }
.tile-4 .tile-inner    { background: #ede0c8; color: #776e65; }
.tile-8 .tile-inner    { background: #f2b179; color: #f9f6f2; }
.tile-16 .tile-inner   { background: #f59563; color: #f9f6f2; }
.tile-32 .tile-inner   { background: #f67c5f; color: #f9f6f2; }
.tile-64 .tile-inner   { background: #f65e3b; color: #f9f6f2; }
.tile-128 .tile-inner  { background: #edcf72; color: #f9f6f2; }
.tile-256 .tile-inner  { background: #edcc61; color: #f9f6f2; }
.tile-512 .tile-inner  { background: #edc850; color: #f9f6f2; }
.tile-1024 .tile-inner { background: #edc53f; color: #f9f6f2; }
.tile-2048 .tile-inner { background: #edc22e; color: #f9f6f2; box-shadow: 0 0 22px rgba(237,194,46,.55), 0 2px 8px rgba(0,0,0,.12); }
.tile-4096 .tile-inner { background: #3c3a32; color: #f9f6f2; }
.tile-8192 .tile-inner, .tile-16384 .tile-inner, .tile-32768 .tile-inner, .tile-65536 .tile-inner, .tile-131072 .tile-inner { background: #2f2d28; color: #f9f6f2; }

/* 加分浮动 */
.float-score {
  position: absolute;
  transform: translate(-50%, -50%);
  font-size: 20px;
  font-weight: 800;
  color: var(--accent);
  pointer-events: none;
  z-index: 5;
  text-shadow: 0 1px 3px rgba(0,0,0,.18);
  animation: floatUp 600ms ease-out forwards;
}
@keyframes floatUp {
  0% { opacity: 1; translate: 0 0; }
  100% { opacity: 0; translate: 0 -46px; }
}

/* ============ 方向键 ============ */
/* ============ 排行榜 ============ */
.rank { margin-top: 14px; }
.rank-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 14px;
  font-weight: 700;
  margin-bottom: 8px;
}
.rank-head .btn-icon { padding: 3px 8px; font-size: 12px; }
.rank-boards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.rank-board {
  background: var(--panel);
  border-radius: 8px;
  padding: 8px 10px;
  box-shadow: var(--shadow);
}
.rank-title { font-size: 12px; font-weight: 700; color: rgba(255,255,255,.85); margin-bottom: 6px; }
.rank-list { display: flex; flex-direction: column; gap: 2px; }
.rank-row {
  display: grid;
  grid-template-columns: 20px 1fr 42px 40px;
  gap: 4px;
  align-items: center;
  font-size: 12px;
  line-height: 19px;
  color: #fff;
}
.rank-row.first .rk { color: #ffd75e; font-weight: 800; }
.rank-row.empty { color: rgba(255,255,255,.35); }
.rank-row .rk { text-align: center; }
.rank-row .rs { text-align: right; font-weight: 700; }
.rank-row .rm { text-align: right; color: rgba(255,255,255,.7); font-size: 11px; }
.rank-row .rd { text-align: right; color: rgba(255,255,255,.55); font-size: 11px; }

footer.hint { margin-top: 12px; text-align: center; font-size: 11px; color: var(--text-sub); }

/* ============ 弹窗 ============ */
.modal-mask {
  position: fixed; inset: 0;
  background: var(--modal-mask);
  backdrop-filter: blur(3px);
  display: flex; align-items: center; justify-content: center;
  z-index: 100;
  opacity: 0; visibility: hidden;
  transition: opacity .25s ease, visibility .25s ease;
}
.modal-mask.show { opacity: 1; visibility: visible; }
.modal {
  background: var(--modal-card);
  border-radius: 14px;
  padding: 28px 32px;
  max-width: 360px;
  width: calc(100% - 48px);
  text-align: center;
  box-shadow: var(--shadow);
  transform: scale(.92) translateY(10px);
  transition: transform .25s ease;
}
.modal-mask.show .modal { transform: scale(1) translateY(0); }
.modal h2 { margin: 0 0 8px; font-size: 30px; }
.modal p.desc { margin: 0 0 20px; color: var(--text-sub); font-size: 14px; line-height: 1.7; }
.modal .big-score { font-size: 40px; font-weight: 800; margin: 4px 0 20px; color: var(--accent); }
.modal .modal-actions { display: flex; gap: 10px; justify-content: center; }
.modal .btn { font-size: 15px; padding: 10px 18px; }
.modal ul.help { text-align: left; font-size: 13.5px; color: var(--text); line-height: 1.9; margin: 0 0 20px; padding-left: 18px; }
.modal ul.help b { color: var(--accent); }
.toast {
  position: fixed; left: 50%; bottom: 42px;
  transform: translateX(-50%);
  background: var(--panel); color: #fff;
  padding: 10px 20px; border-radius: 20px;
  font-size: 13px; font-weight: 600;
  box-shadow: var(--shadow);
  opacity: 0; visibility: hidden;
  transition: opacity .25s ease, visibility .25s ease;
  z-index: 200;
}
.toast.show { opacity: 1; visibility: visible; }
</style>
</head>

<script src="logic.js"></script>
<script>
'use strict';

/* ================= 状态 ================= */
const SIZES = [3, 4, 5, 6, 7, 8];
const TARGETS = { 3: 1024 };          // 其余尺寸默认 2048
const UNDO_LIMIT = 100;

let state = {
  size: 4,
  tiles: [],          // {id, value, r, c, dead, el}
  score: 0,
  best: 0,
  gameMax: 0,        // 本局达到过的最高方块（曾合成到的最大数字）
  won: false,
  over: false,
  started: false,
  history: [],        // {tiles, score}
  sound: true,
  target: 2048,
  aiOn: false,
  aiLevel: 'normal',  // 'normal' 普通 / 'master' 大师
  aiSpeed: 1,         // 移动间隔（秒）：0.5 / 0.75 / 1
  leaderboard: { player: [], ai: [] },  // 各存前 5 条 {score, maxTile, size, date}
};
let tileSeq = 0;
let moving = false;
let pendingMerges = [];
let aiTimer = null;

const $ = s => document.querySelector(s);
const boardEl = $('#board');
const bgGridEl = $('#bgGrid');
const scoreEl = $('#score');
const bestEl = $('#best');

/* ================= 持久化（pywebview 桥 / localStorage 回退） ================= */
/* 注意：window.pywebview.api 在桥接注入早期可能只是空对象，必须校验方法真实存在，
   否则调用 undefined 函数会抛错中断初始化。 */
function bridgeApi() {
  const api = window.pywebview && window.pywebview.api;
  if (api && typeof api.save_state === 'function' && typeof api.load_state === 'function') {
    return api;
  }
  return null;
}

function persist() {
  const data = {
    size: state.size, best: state.best, sound: state.sound,
    aiLevel: state.aiLevel, aiSpeed: state.aiSpeed, leaderboard: state.leaderboard,
  };
  const api = bridgeApi();
  if (api) {
    api.save_state(data);
  } else {
    try { localStorage.setItem('zcode2048.v1', JSON.stringify(data)); } catch (e) {}
  }
}

function loadPersisted() {
  const api = bridgeApi();
  if (api) return api.load_state();
  try {
    const raw = localStorage.getItem('zcode2048.v1');
    return Promise.resolve(raw ? JSON.parse(raw) : null);
  } catch (e) { return Promise.resolve(null); }
}

/* ================= 音频（Web Audio 合成，无外部资源） ================= */
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) audioCtx = new AC();
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, dur, type, vol, when) {
  if (!audioCtx) return;
  const t0 = audioCtx.currentTime + (when || 0);
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  gain.gain.setValueAtTime(0.0001, t0);
  gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.05);
}
function playSound(kind) {
  if (!state.sound) return;
  ensureAudio();
  if (!audioCtx) return;
  switch (kind) {
    case 'move':   tone(190, 0.07, 'square', 0.045); break;
    case 'merge':  tone(440, 0.09, 'triangle', 0.16); tone(660, 0.11, 'triangle', 0.15, 0.05); break;
    case 'newbest':tone(523, 0.1, 'sine', 0.14); tone(659, 0.1, 'sine', 0.13, 0.08); tone(784, 0.16, 'sine', 0.13, 0.16); break;
    case 'win':    [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.18, 'triangle', 0.16, i * 0.12)); break;
    case 'lose':   [392, 330, 262, 196].forEach((f, i) => tone(f, 0.22, 'sine', 0.14, i * 0.16)); break;
    case 'undo':   tone(300, 0.06, 'sine', 0.1); tone(420, 0.06, 'sine', 0.09, 0.05); break;
    case 'new':    tone(520, 0.09, 'sine', 0.12); tone(700, 0.12, 'sine', 0.1, 0.07); break;
  }
}

/* ================= 棋盘几何 ================= */
function gapPx() {
  return parseFloat(getComputedStyle(boardEl).getPropertyValue('--gap')) || 12;
}
function cellGeom() {
  const W = boardEl.clientWidth;
  const g = gapPx();
  const cell = (W - g * (state.size + 1)) / state.size;
  return { cell, g, W };
}
function posOf(r, c) {
  const { cell, g } = cellGeom();
  return { x: g + c * (cell + g), y: g + r * (cell + g), cell };
}

/* ================= 渲染 ================= */
function buildBoard() {
  boardEl.style.setProperty('--n', state.size);
  bgGridEl.innerHTML = '';
  for (let i = 0; i < state.size * state.size; i++) {
    const d = document.createElement('div');
    d.className = 'bg-cell';
    bgGridEl.appendChild(d);
  }
}

function tileColorClass(v) {
  let cls = 'tile-' + v;
  if (v > 131072) cls = 'tile-131072';
  else if (v > 4096) cls = 'tile-4096';
  return cls;
}

function createTile(value, r, c, extra) {
  const { cell } = posOf(r, c);
  const digits = String(value).length;
  const fsize = cell * (digits <= 2 ? 0.46 : digits === 3 ? 0.40 : digits === 4 ? 0.32 : 0.26);
  const el = document.createElement('div');
  el.className = 'tile ' + tileColorClass(value) + (extra ? ' ' + extra : '');
  el.style.width = cell + 'px';
  el.style.height = cell + 'px';
  const inner = document.createElement('div');
  inner.className = 'tile-inner';
  inner.style.fontSize = fsize.toFixed(1) + 'px';
  inner.innerHTML = '<span>' + value + '</span>';
  el.appendChild(inner);
  // 关键：先设置定位再插入 DOM。若先插入再设 transform，外层 .tile 的
  // transition 会从初始值 none（左上角 0,0）过渡到目标位置，导致新方块
  // 从左上角飞入；先定位后插入则首帧无位移变化，过渡不会触发。
  const p = posOf(r, c);
  el.style.transform = 'translate(' + p.x + 'px,' + p.y + 'px)';
  boardEl.appendChild(el);
  const id = ++tileSeq;
  const tile = { id, value, r, c, dead: false, el };
  state.tiles.push(tile);
  return tile;
}

function placeTile(tile, r, c) {
  tile.r = r; tile.c = c;
  const p = posOf(r, c);
  tile.el.style.transform = 'translate(' + p.x + 'px,' + p.y + 'px)';
}

function clearTiles() {
  state.tiles.forEach(t => t.el.remove());
  state.tiles = [];
}

function toGrid() {
  const g = Array.from({ length: state.size }, () => Array(state.size).fill(0));
  for (const t of state.tiles) if (!t.dead) g[t.r][t.c] = t.value;
  return g;
}

function floatScore(value, r, c) {
  const p = posOf(r, c);
  const { cell } = p;
  const el = document.createElement('div');
  el.className = 'float-score';
  el.textContent = '+' + value;
  el.style.left = (p.x + cell / 2) + 'px';
  el.style.top = (p.y + cell / 2) + 'px';
  boardEl.appendChild(el);
  setTimeout(() => el.remove(), 640);
}

/* ================= 本局最高 ================= */
function updateGameMax() {
  // 取当前棋盘最大块，刷新"本局最高"（只增不减，曾合成到的最大数字）
  let m = 0;
  for (const t of state.tiles) if (!t.dead && t.value > m) m = t.value;
  if (m > state.gameMax) state.gameMax = m;
  $('#gameMax').textContent = '本局最高 ' + state.gameMax;
}

/* ================= 分数 ================= */
function animateScore(from, to) {
  const t0 = performance.now();
  const dur = 160;
  (function step(t) {
    const p = Math.min(1, (t - t0) / dur);
    scoreEl.textContent = Math.round(from + (to - from) * p);
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}
function updateScore(flashBest) {
  const prevBest = state.best;
  if (state.score > state.best) {
    state.best = state.score;
    bestEl.textContent = state.best;
    persist();
    if (flashBest && prevBest > 0 && !bestBox.classList.contains('glow')) {
      bestBox.classList.add('glow');
      setTimeout(() => bestBox.classList.remove('glow'), 950);
      playSound('newbest');
    }
  }
  bestEl.textContent = state.best;
}
function updateButtons() {
  $('#btnUndo').disabled = state.history.length === 0 || moving || state.aiOn;
}

/* ================= 自动玩（AI） ================= */
function aiStep() {
  if (!state.aiOn || moving || state.over) return;
  const dir = aiBestMove(toGrid(), state.aiLevel);
  if (dir) doMove(dir);
  // dir 为 null 说明棋盘已死局：finishMove 的胜负判定已弹出结束框，这里静默等待即可
}
function startAi() {
  state.aiOn = true;
  const btn = $('#btnAi');
  btn.textContent = '⏹ 停止';
  btn.classList.add('ai-running');
  $('#selAiLevel').disabled = true;
  toast('🤖 已开启自动玩（' + (state.aiLevel === 'master' ? '大师' : '普通') + '，每 ' + state.aiSpeed + ' 秒一步）');
  updateButtons();
  clearInterval(aiTimer);
  aiTimer = setInterval(aiStep, state.aiSpeed * 1000);
}
function stopAi() {
  state.aiOn = false;
  clearInterval(aiTimer);
  aiTimer = null;
  const btn = $('#btnAi');
  btn.textContent = '🤖 自动玩';
  btn.classList.remove('ai-running');
  $('#selAiLevel').disabled = false;
  updateButtons();
}
/** 切换 AI 速度：AI 运行中立即生效（重启定时器），否则下次启动生效 */
function applyAiSpeed() {
  const s = parseFloat($('#selAiSpeed').value);
  if (![0.5, 0.75, 1].includes(s)) return;
  state.aiSpeed = s;
  persist();
  if (state.aiOn) {
    clearInterval(aiTimer);
    aiTimer = setInterval(aiStep, s * 1000);
  }
  toast('AI 速度：' + s + ' 秒/步');
}

/* ================= 排行榜 ================= */
function fmtDate(ts) {
  const d = new Date(ts);
  return (d.getMonth() + 1) + '-' + d.getDate();
}
/** 游戏结束时把本局成绩记入对应榜单（AI 模式记 AI 榜，否则记玩家榜），各保留前 5 名。 */
function recordScore() {
  if (state.score <= 0) return;
  const entry = {
    score: state.score,
    maxTile: state.gameMax,   // 本局最高合成数字
    size: state.size,
    date: Date.now(),
  };
  const key = state.aiOn ? 'ai' : 'player';
  state.leaderboard[key].push(entry);
  state.leaderboard[key].sort((a, b) => b.score - a.score);
  state.leaderboard[key] = state.leaderboard[key].slice(0, 5);
  persist();
  renderLeaderboard();
}
function renderLeaderboard() {
  renderRank($('#rankPlayer'), state.leaderboard.player);
  renderRank($('#rankAi'), state.leaderboard.ai);
}
function renderRank(el, list) {
  let html = '';
  for (let i = 0; i < 5; i++) {
    const e = list[i];
    html += e
      ? '<div class="rank-row' + (i === 0 ? ' first' : '') + '">'
        + '<span class="rk">' + (i + 1) + '</span>'
        + '<span class="rs">' + e.score + '</span>'
        + '<span class="rm">' + e.maxTile + '</span>'
        + '<span class="rd">' + fmtDate(e.date) + '</span>'
        + '</div>'
      : '<div class="rank-row empty">'
        + '<span class="rk">' + (i + 1) + '</span>'
        + '<span class="rs">--</span><span class="rm"></span><span class="rd"></span>'
        + '</div>';
  }
  el.innerHTML = html;
}
function clearLeaderboard() {
  showModal(
    '<h2>清空排行榜？</h2><p class="desc">玩家榜和 AI 榜的所有记录将被删除。</p>' +
    '<div class="modal-actions">' +
    '<button class="btn" data-close>取消</button>' +
    '<button class="btn btn-primary" id="confirmClear">确认清空</button></div>'
  );
  $('#confirmClear').addEventListener('click', () => {
    hideModal();
    state.leaderboard = { player: [], ai: [] };
    persist();
    renderLeaderboard();
    toast('排行榜已清空');
  });
}

/* ================= 移动 ================= */
function computeTileMoves(dir) {
  const { rowMajor, reverse } = dirConfig(dir);
  const size = state.size;
  const alive = state.tiles.filter(t => !t.dead);
  const updates = [];
  const merges = [];
  let gained = 0;
  const coord = p => reverse ? size - 1 - p : p;

  for (let k = 0; k < size; k++) {
    const line = rowMajor
      ? alive.filter(t => t.r === k).sort((a, b) => a.c - b.c)
      : alive.filter(t => t.c === k).sort((a, b) => a.r - b.r);
    if (reverse) line.reverse();

    let pos = 0, i = 0;
    while (i < line.length) {
      const t = line[i];
      const target = rowMajor ? { r: k, c: coord(pos) } : { r: coord(pos), c: k };
      if (i + 1 < line.length && t.value === line[i + 1].value) {
        const b = line[i + 1];
        merges.push({ value: t.value * 2, r: target.r, c: target.c, src: [t, b] });
        gained += t.value * 2;
        i += 2;
      } else {
        updates.push({ tile: t, r: target.r, c: target.c });
        i += 1;
      }
      pos += 1;
    }
  }
  return { updates, merges, gained };
}

function doMove(dir) {
  if (moving || state.over) return;
  const result = move(toGrid(), dir);
  if (!result.moved) return;

  moving = true;
  state.started = true;
  pushHistory();

  const plan = computeTileMoves(dir);
  for (const u of plan.updates) placeTile(u.tile, u.r, u.c);
  for (const m of plan.merges) {
    for (const s of m.src) {
      s.dead = true;
      placeTile(s, m.r, m.c);
    }
    pendingMerges.push(m);
  }

  const prevScore = state.score;
  state.score += plan.gained;
  updateScore(true);
  animateScore(prevScore, state.score);
  for (const m of plan.merges) floatScore(m.value, m.r, m.c);
  playSound(plan.merges.length ? 'merge' : 'move');
  updateButtons();

  setTimeout(finishMove, 120);
}

function finishMove() {
  // 合并产生的旧块已动画滑入目标格，从状态与 DOM 中一并移除，避免元素残留
  state.tiles = state.tiles.filter(t => !t.dead);
  for (const m of pendingMerges) {
    for (const s of m.src) s.el.remove();
  }
  for (const m of pendingMerges) createTile(m.value, m.r, m.c, 'tile-merged');
  pendingMerges = [];

  const g = toGrid();
  const cells = emptyCells(g);
  if (cells.length) {
    const pick = cells[Math.floor(Math.random() * cells.length)];
    createTile(Math.random() < 0.9 ? 2 : 4, pick.r, pick.c, 'tile-new');
  }

  if (!state.won && hasWon(toGrid(), state.target)) {
    state.won = true;
    setTimeout(showWin, 220);
  } else if (!canMove(toGrid())) {
    state.over = true;
    setTimeout(showLose, 220);
  }
  updateGameMax();
  moving = false;
  updateButtons();
}

/* ================= 撤销 ================= */
function pushHistory() {
  const snap = {
    tiles: state.tiles.map(t => ({ value: t.value, r: t.r, c: t.c })),
    score: state.score,
    gameMax: state.gameMax,
  };
  state.history.push(snap);
  if (state.history.length > UNDO_LIMIT) state.history.shift();
}
function undo() {
  if (moving || !state.history.length || state.aiOn) return;
  const snap = state.history.pop();
  clearTiles();
  state.score = snap.score;
  state.gameMax = snap.gameMax;
  state.over = false;
  for (const t of snap.tiles) createTile(t.value, t.r, t.c);
  scoreEl.textContent = state.score;
  updateGameMax();
  playSound('undo');
  updateButtons();
}

/* ================= 新游戏 / 尺寸 ================= */
function newGame() {
  clearTiles();
  state.score = 0;
  state.gameMax = 0;
  state.history = [];
  state.won = false;
  state.over = false;
  state.started = false;
  let g = newGrid(state.size);
  for (let r = 0; r < state.size; r++)
    for (let c = 0; c < state.size; c++)
      if (g[r][c]) createTile(g[r][c], r, c, 'tile-new');
  scoreEl.textContent = 0;
  updateGameMax();
  updateButtons();
}

function applySize(n) {
  state.size = n;
  state.target = TARGETS[n] || 2048;
  $('#goalText').textContent = state.target;
  buildBoard();
  newGame();
  persist();
  toast('已切换到 ' + n + '×' + n + ' 棋盘');
}

/* ================= 弹窗 / 提示 ================= */
let modalOnClose = null;
function showModal(html, onClose) {
  $('#modal').innerHTML = html;
  $('#mask').classList.add('show');
  modalOnClose = onClose || null;
  const self = $('#modal');
  self.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => hideModal()));
}
function hideModal() {
  $('#mask').classList.remove('show');
  if (modalOnClose) { const f = modalOnClose; modalOnClose = null; f(); }
}

function showWin() {
  const keep = '<button class="btn" data-close>继续游戏</button>';
  const restart = '<button class="btn btn-primary" id="winRestart">再来一局</button>';
  showModal(
    '<h2>🏆 你赢了！</h2>' +
    '<p class="desc">你成功合成了 <b>' + state.target + '</b>！<br>可以继续挑战更高分。</p>' +
    '<div class="big-score">' + state.score + '</div>' +
    '<div class="modal-actions">' + keep + restart + '</div>'
  );
  $('#winRestart').addEventListener('click', () => { hideModal(); newGame(); playSound('new'); });
  playSound('win');
}
function showLose() {
  recordScore();  // 游戏结束，自动把本局成绩记入排行榜
  const restart = '<button class="btn btn-primary" id="loseRestart">再来一局</button>';
  showModal(
    '<h2>😵 游戏结束</h2>' +
    '<p class="desc">没有可移动的方块了。</p>' +
    '<div class="big-score">' + state.score + '</div>' +
    '<div class="modal-actions">' + restart + '</div>'
  );
  $('#loseRestart').addEventListener('click', () => { hideModal(); newGame(); playSound('new'); });
  playSound('lose');
}
function showHelp() {
  showModal(
    '<h2>📖 怎么玩</h2>' +
    '<ul class="help">' +
    '<li>每次操作，所有方块<b>向同一方向滑动</b>，相同数字碰撞会<b>合并成它们的和</b>。</li>' +
    '<li>每次移动后，空位会随机生成一个 <b>2 或 4</b>。</li>' +
    '<li>目标：合成 <b>' + state.target + '</b>' + (state.size === 3 ? '（3×3 棋盘目标为 1024）' : '') + '。</li>' +
    '<li>无空格且无法合并时游戏结束；可用 <b>撤销</b> 挽救一步。</li>' +
    '<li>操作：<b>方向键 / WASD / 滑动 / 屏幕按钮</b>，<b>Ctrl+Z</b> 撤销。</li>' +
    '<li><b>🤖 自动玩</b>：点击按钮由 AI 自动走棋，可随时停止；移动速度可选 <b>0.5s / 0.75s / 1s</b>，运行中也能随时调速；</li>' +
    '<li>自动玩前可切换 <b>AI 强度</b>（普通 / 大师），大师档思考更深、成绩更好。</li>' +
    '</ul>' +
    '<div class="modal-actions"><button class="btn btn-primary" data-close>知道了</button></div>'
  );
}
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 1600);
}

/* ================= 音效 ================= */
function setSound(on) {
  state.sound = on;
  $('#btnSound').textContent = on ? '🔊' : '🔇';
  persist();
}

/* ================= 输入 ================= */
document.addEventListener('keydown', e => {
  if (state.aiOn) return;  // 自动玩期间屏蔽手动操作
  if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z')) {
    e.preventDefault(); undo(); return;
  }
  const map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
                a: 'left', d: 'right', w: 'up', s: 'down', A: 'left', D: 'right', W: 'up', S: 'down' };
  const dir = map[e.key];
  if (dir) { e.preventDefault(); doMove(dir); }
});

let touchStart = null;
boardEl.addEventListener('touchstart', e => {
  touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });
boardEl.addEventListener('touchend', e => {
  if (!touchStart) return;
  const dx = e.changedTouches[0].clientX - touchStart.x;
  const dy = e.changedTouches[0].clientY - touchStart.y;
  touchStart = null;
  if (state.aiOn) return;  // 自动玩期间屏蔽滑动
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
  doMove(dir);
}, { passive: true });

$('#btnNew').addEventListener('click', () => {
  if (state.started || state.score > 0) {
    showModal(
      '<h2>开始新游戏？</h2><p class="desc">当前进度将丢失。</p>' +
      '<div class="modal-actions">' +
      '<button class="btn" data-close>取消</button>' +
      '<button class="btn btn-primary" id="confirmNew">确认</button></div>'
    );
    $('#confirmNew').addEventListener('click', () => { hideModal(); newGame(); playSound('new'); });
  } else { newGame(); playSound('new'); }
});
$('#btnUndo').addEventListener('click', undo);
$('#btnAi').addEventListener('click', () => state.aiOn ? stopAi() : startAi());
$('#btnClearRank').addEventListener('click', clearLeaderboard);
$('#selAiLevel').addEventListener('change', e => {
  state.aiLevel = e.target.value === 'master' ? 'master' : 'normal';
  persist();
  toast('AI 强度：' + (state.aiLevel === 'master' ? '大师' : '普通'));
});
$('#selAiSpeed').addEventListener('change', applyAiSpeed);
$('#btnHelp').addEventListener('click', showHelp);
$('#btnSound').addEventListener('click', () => { setSound(!state.sound); if (state.sound) playSound('undo'); });

$('#selSize').addEventListener('change', e => {
  const n = parseInt(e.target.value, 10);
  if (n === state.size) return;
  const doSwitch = () => applySize(n);
  if (state.started || state.score > 0) {
    showModal(
      '<h2>切换棋盘？</h2><p class="desc">切换到 ' + n + '×' + n + ' 将开始新游戏，当前进度将丢失。</p>' +
      '<div class="modal-actions">' +
      '<button class="btn" data-close>取消</button>' +
      '<button class="btn btn-primary" id="confirmSize">切换</button></div>'
    );
    $('#confirmSize').addEventListener('click', () => { hideModal(); doSwitch(); playSound('new'); });
    e.target.value = state.size;
  } else { doSwitch(); }
});

/* 窗口尺寸变化时重排方块位置（不带动画） */
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    for (const t of state.tiles) placeTile(t, t.r, t.c);
  }, 120);
});

/* ================= 初始化 ================= */
function init() {
  // 尺寸下拉
  $('#selSize').innerHTML = SIZES.map(n => '<option value="' + n + '">' + n + '×' + n + '</option>').join('');
  $('#selSize').value = state.size;
  $('#goalText').textContent = state.target;
  setSound(state.sound);
  $('#selAiLevel').value = state.aiLevel;
  $('#selAiSpeed').value = String(state.aiSpeed);
  bestEl.textContent = state.best;
  buildBoard();
  renderLeaderboard();
  newGame();
}

/**
 * 等待 pywebview 桥接就绪后再执行回调。
 * 桥接注入与页面脚本执行存在时序竞态：早期 window.pywebview 可能为 undefined，
 * 或 window.pywebview.api 存在但方法尚未创建。就绪后 pywebview 会触发
 * 'pywebviewready' 事件；无桥接环境（纯浏览器调试）超时后以 localStorage 模式继续。
 */
function whenBridgeReady(cb) {
  if (bridgeApi()) { cb(); return; }
  const timer = setTimeout(cb, 1500);
  window.addEventListener('pywebviewready', function onReady() {
    clearTimeout(timer);
    cb();
  }, { once: true });
}

whenBridgeReady(function () {
  loadPersisted().then(data => {
    if (data && typeof data === 'object') {
      if (SIZES.includes(data.size)) state.size = data.size;
      if (typeof data.best === 'number') state.best = data.best;
      if (typeof data.sound === 'boolean') state.sound = data.sound;
      if (data.aiLevel === 'normal' || data.aiLevel === 'master') state.aiLevel = data.aiLevel;
      if ([0.5, 0.75, 1].includes(data.aiSpeed)) state.aiSpeed = data.aiSpeed;
      if (data.leaderboard && typeof data.leaderboard === 'object') {
        const clean = (arr) => Array.isArray(arr) ? arr.slice(0, 5) : [];
        state.leaderboard = {
          player: clean(data.leaderboard.player),
          ai: clean(data.leaderboard.ai),
        };
      }
    }
    state.target = TARGETS[state.size] || 2048;
    init();
  }).catch(() => init());
});
</script>
